services:
  postgres:
    image: postgres:17-alpine
    container_name: soybean-admin-naive-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: soybean
      POSTGRES_PASSWORD: soybean_admin_dev
      POSTGRES_DB: soybean_admin_naive
    ports:
      - '5432:5432'
    volumes:
      - soybean_admin_naive_postgres:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    container_name: soybean-admin-naive-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - soybean_admin_naive_redis:/data

volumes:
  soybean_admin_naive_postgres:
  soybean_admin_naive_redis:
